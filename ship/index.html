<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(ellipse at center, #1a1a22 0%, #0a0a12 70%);
            font-family: "Courier New", Courier, monospace;
            color: #c8c8c8;
        }

        .frame {
            --frame-pad: 18px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: var(--frame-pad);
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 32px);
            max-height: calc(100dvh - 32px);
        }

        /* портрет — выше, чем шире */
        .frame--portrait {
            width: min(92vw, 420px, calc((100dvh - 32px) * 4 / 5));
            aspect-ratio: 4 / 5;
            height: auto;
        }

        /* квадрат */
        .frame--square {
            width: min(86vw, 480px, calc(100dvh - 32px));
            aspect-ratio: 1 / 1;
            height: auto;
        }

        /* альбом — шире, чем выше */
        .frame--landscape {
            width: min(92vw, 720px, calc((100dvh - 32px) * 3 / 2));
            aspect-ratio: 3 / 2;
            height: auto;
        }

        /* широкий кадр */
        .frame--wide {
            width: min(94vw, 900px, calc((100dvh - 32px) * 16 / 9));
            aspect-ratio: 16 / 9;
            height: auto;
        }

        .frame__corner {
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: #9a9a9a;
            border-style: solid;
            border-width: 0;
        }

        .frame__corner--tl {
            top: 0;
            left: 0;
            border-top-width: 2px;
            border-left-width: 2px;
        }

        .frame__corner--tr {
            top: 0;
            right: 0;
            border-top-width: 2px;
            border-right-width: 2px;
        }

        .frame__corner--bl {
            bottom: 0;
            left: 0;
            border-bottom-width: 2px;
            border-left-width: 2px;
        }

        .frame__corner--br {
            bottom: 0;
            right: 0;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }

        .frame__panel {
            position: relative;
            width: 100%;
            height: 100%;
            background: #5a5a5a;
            overflow: hidden;
        }

        .frame__media {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        video.frame__media {
            background: #3a3a3a;
            pointer-events: none;
        }

        .frame__text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            width: min(36ch, 72vw);
            margin: 0;
            padding: 0;
            font-size: clamp(14px, 2.8vw, 17px);
            line-height: 1.55;
            text-align: center;
            color: #d6d6d6;
            text-wrap: balance;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!--
      Формат блока выбирается случайно из форматов данных (MIME).
      Можно зафиксировать: data-format="image/jpeg" | image/png | image/gif |
      image/webp | image/heic | video/mp4 | video/webm
    -->
    <div class="frame" data-format="random" aria-hidden="true">
        <span class="frame__corner frame__corner--tl"></span>
        <span class="frame__corner frame__corner--tr"></span>
        <span class="frame__corner frame__corner--bl"></span>
        <span class="frame__corner frame__corner--br"></span>

        <div class="frame__panel">
            <!-- фото:
            <img class="frame__media" src="photo.jpg" alt="">
            -->
            <!-- видео:
            <video class="frame__media" src="clip.mp4" muted loop playsinline autoplay></video>
            -->
        </div>
    </div>

    <p class="frame__text" role="main">
        Вам снова показывают эти фото или видео — очень старые.
        Вы их удалили. Незнаете, где они.
        А они, например, вот они.
    </p>

<script>
    const FORMAT_CLASSES = [
        'frame--portrait',
        'frame--square',
        'frame--landscape',
        'frame--wide',
    ];

    /* форматы данных → пропорции блока */
    const DATA_FORMATS = {
        'image/jpeg': 'frame--landscape',
        'image/png': 'frame--portrait',
        'image/gif': 'frame--square',
        'image/webp': 'frame--landscape',
        'image/heic': 'frame--portrait',
        'video/mp4': 'frame--wide',
        'video/webm': 'frame--wide',
    };

    const DATA_FORMAT_KEYS = Object.keys(DATA_FORMATS);

    function applyFormat(frame, formatClass) {
        frame.classList.remove(...FORMAT_CLASSES);
        frame.classList.add(formatClass);
    }

    function applyDataFormat(frame, dataFormat) {
        const formatClass = DATA_FORMATS[dataFormat];
        if (!formatClass) return;

        frame.dataset.format = dataFormat;
        applyFormat(frame, formatClass);
    }

    function pickRandomDataFormat() {
        return DATA_FORMAT_KEYS[Math.floor(Math.random() * DATA_FORMAT_KEYS.length)];
    }

    function initFrame(frame) {
        const requested = frame.dataset.format;

        if (!requested || requested === 'random') {
            applyDataFormat(frame, pickRandomDataFormat());
            return;
        }

        if (DATA_FORMATS[requested]) {
            applyDataFormat(frame, requested);
        }
    }

    document.querySelectorAll('.frame').forEach(initFrame);
</script>
</body>
</html>
